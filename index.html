<!doctype html>
<html lang="en" data-theme="emerald" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#060d0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Duo">
<title>Duo</title>
<link rel="stylesheet" href="css/app.css?v=37">
<link rel="stylesheet" href="css/themes-ugc.css?v=28">
<link rel="stylesheet" href="css/fx.css?v=31">
<link rel="stylesheet" href="css/journey.css?v=34">
<link rel="stylesheet" href="css/slides.css?v=35">
<link rel="stylesheet" href="css/research.css?v=1">
</head>
<body>
<a href="#main" class="sr">Skip to content</a>
<div id="fx-aurora" aria-hidden="true"></div><div id="fx-grid" aria-hidden="true"></div><canvas id="fx-bg" aria-hidden="true"></canvas><div id="fx-cursor" aria-hidden="true"></div>
<div id="boot" aria-hidden="true"><div><div class="ring"></div><b>DUO</b><i>SYNCING COMMAND CENTER</i></div></div>
<div class="shell">
  <aside class="side" id="side" aria-label="Main navigation">
    <button class="brand" data-go="dash" aria-label="Duo — go to Command Center"><span class="logo" aria-hidden="true"></span>DUO</button>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn s menuBtn" id="menu" aria-label="Open menu" aria-controls="side">☰ Menu</button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <span class="sp"></span>
      <span class="sync" id="sync" role="status"></span>
      <button class="btn s" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶<span class="hide-m"> Undo</span></button>
      <button class="btn s" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷<span class="hide-m"> Redo</span></button>
      <div style="position:relative">
        <button class="btn s p" id="qaBtn" aria-haspopup="menu" aria-expanded="false">＋<span class="qa-l"> Quick add</span></button>
        <div class="qa-menu" id="qaMenu" role="menu" hidden>
          <button role="menuitem" data-qk="task">✓ Task</button>
          <button role="menuitem" data-qk="note">📝 Note</button>
          <button role="menuitem" data-qk="idea">💡 Idea (Mind Web)</button>
          <button role="menuitem" data-qk="suggestion">💬 Suggestion for partner</button>
          <button role="menuitem" data-qk="schedule">📅 Schedule item</button>
          <button role="menuitem" data-qk="check">☑ Checklist item</button>
        </div>
      </div>
      <button class="btn s" id="findBtn" aria-label="Find anything" title="Find anything (/ or Ctrl+K)">🔍<span class="hide-m"> Find</span></button>
      <button class="btn s" id="layoutBtn" aria-pressed="false"></button>
      <button class="btn s" id="helpBtn" aria-label="Help and tips" title="Help (?)">❔<span class="hide-m"> Help</span></button>
      <button class="btn s ghost" id="meChip" data-go="profile" aria-label="Your profile"></button>
    </header>
    <main id="main" tabindex="-1"><div class="page" id="page"></div></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Quick navigation"></nav>
<nav class="slidebar" id="slidebar" aria-label="Slides" hidden></nav>
<dialog id="dlg" aria-modal="true"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script src="js/opportunity.js?v=28"></script>
<script src="js/core.js?v=29"></script>
<script src="js/ui.js?v=28"></script>
<script src="js/views.js?v=34"></script>
<script src="js/schedule.js?v=33"></script>
<script src="js/web.js?v=34"></script>
<script src="js/profile.js?v=33"></script>
<script src="js/journey.js?v=35"></script>
<script src="js/ideas.js?v=33"></script>
<script src="js/guide.js?v=33"></script>
<script src="js/slides.js?v=35"></script>
<script src="js/find.js?v=33"></script>
<script src="js/clipping.js?v=30"></script>
<script src="js/clipflow.js?v=28"></script>
<script src="js/research.js?v=1"></script>
<script src="js/agenda.js?v=31"></script>
<script src="js/help.js?v=31"></script>
<script src="js/sync.js?v=28"></script>
<script src="js/auth.js?v=28"></script>
<script src="js/push.js?v=29"></script>
<script src="js/fx.js?v=28"></script>
<script src="js/app.js?v=28"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
